name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,cvat]"

      - name: Run tests
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q src tests

  windows-script:
    name: Windows PowerShell script
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Smoke-test local CVAT helper
        shell: powershell
        run: |
          $output = powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\cvat-local.ps1 url
          if ($LASTEXITCODE -ne 0) {
              throw "cvat-local.ps1 exited with code $LASTEXITCODE"
          }
          if ($output.Trim() -ne "http://localhost:8080") {
              throw "Unexpected CVAT URL: $output"
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\cvat-smoke.ps1 -Help
          if ($LASTEXITCODE -ne 0) {
              throw "cvat-smoke.ps1 -Help exited with code $LASTEXITCODE"
          }
