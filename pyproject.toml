[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "welding-annotation-qa"
version = "0.4.0"
description = "CVAT-based Welding Defect Annotation QA and Curation Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
cvat = [
    "cvat-sdk==2.71.0",
]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
welding_qa = ["resources/*.yaml"]
